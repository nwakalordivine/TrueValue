[project]
name = "truevalue-backend"
version = "1.0.0"
description = "TrueValue API: ethical shopping assistant (Tech Skills Showcase 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "httpx>=0.27",
    "pyjwt>=2.15.1",
    "cloudinary>=1.47.0",
    "python-multipart>=0.0.32",
]

[tool.vercel]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
